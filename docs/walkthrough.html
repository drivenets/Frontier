<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project walkthrough</title>
<style>
:root{
  --paper:#F1F2EE; --ink:#10141B; --prior:#7A5200; --ours:#0A3FC4; --tbd:#C4175F; --mute:#5B6472;
  --line:#C5C9CE; --white:#FFFFFF;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --top:3.6rem; --railw:17.5rem;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,.6vw + 10px,22px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ours)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.5rem 1rem;z-index:50}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:1rem;padding:0 1.25rem;background:var(--ink);color:var(--paper);border-bottom:4px solid var(--paper)}
.top h1{font:800 1.05rem/1 var(--sans);letter-spacing:.02em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:2px solid var(--paper);color:var(--paper);padding:.4rem .8rem;font:700 .8rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.top button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.top button:focus-visible{outline-color:var(--paper)}
.app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;padding:1rem .75rem 1rem .5rem;border-right:2px solid var(--ink);background:var(--paper)}
.rail ol{list-style:none;margin:0;padding:0;position:relative}
.rail ol::before{content:"";position:absolute;left:1.1rem;top:.6rem;bottom:.6rem;width:4px;background:var(--ink);transform:translateX(-2px)}
.r-item{position:relative;display:grid;grid-template-columns:2.2rem 1fr;gap:.4rem;width:100%;text-align:left;background:transparent;border:0;border-left:0;padding:.45rem .4rem .45rem 0}
.r-item:hover .r-t{text-decoration:underline}
.r-item.on{background:var(--white);box-shadow:inset 4px 0 0 var(--ink)}
.node{justify-self:center;align-self:center;background:var(--ink);border:3px solid var(--paper);box-sizing:content-box;position:relative;z-index:1}
.node.prior{background:var(--prior);border-radius:0}
.node.ours{background:var(--ours);border-radius:50%}
.node.mixed{background:linear-gradient(90deg,var(--prior) 50%,var(--ours) 50%);border-radius:50%}
.node.sys{width:10px;height:10px;border-radius:0;transform:rotate(45deg)}
.node.d-stub{width:10px;height:10px}.node.d-summary{width:16px;height:16px}.node.d-full{width:24px;height:24px}
.r-t{font-weight:700;line-height:1.2;font-size:.95rem}
.r-num{font:700 .8rem var(--mono);color:var(--mute);margin-right:.35rem}
.r-meta{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;margin-top:.2rem;font:600 .72rem/1.2 var(--mono);color:var(--mute);letter-spacing:.04em}
.r-meta .hv{color:var(--ink)}
.keys{margin:1rem 0 0 .5rem;padding-top:.8rem;border-top:2px solid var(--line);font:500 .74rem/1.7 var(--mono);color:var(--mute)}
kbd{font:700 .72rem var(--mono);border:1.5px solid var(--ink);padding:0 .3em;background:var(--white);color:var(--ink)}
main{padding:1.5rem clamp(1rem,3vw,3rem) 4rem;min-width:0;outline:none}
section[data-seq],article[data-seq]{scroll-margin-top:calc(var(--top) + 1rem)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:.45em;font:700 .74rem/1 var(--mono);letter-spacing:.08em;padding:.4em .6em;border:2px solid var(--ink);text-transform:uppercase;background:var(--white);white-space:nowrap}
.badge .g{display:inline-block;width:.75em;height:.75em;background:currentColor}
.badge.prior{border-color:var(--prior);color:var(--prior)}
.badge.ours{background:var(--ours);border-color:var(--ours);color:#fff}
.badge.ours .g{border-radius:50%}
.badge.mixed{border:2px solid transparent;border-image:linear-gradient(90deg,var(--prior) 50%,var(--ours) 50%) 1;color:var(--ink)}
.badge.mixed .g{background:linear-gradient(90deg,var(--prior) 50%,var(--ours) 50%);border-radius:50%}
.badge.depth{border-color:var(--mute);color:var(--ink);background:transparent}
.tbd{display:inline-block;background:var(--tbd);color:#fff;font:800 .7rem/1 var(--mono);letter-spacing:.1em;padding:.3em .5em;vertical-align:middle}
.is-tbd{outline:3px dashed var(--tbd);outline-offset:5px}

/* ---------- overview ---------- */
.ov h2{font:800 clamp(2.2rem,4.4vw,4rem)/1.02 var(--sans);letter-spacing:-.02em;margin:.2rem 0 .6rem;max-width:20ch}
.ov .sub{font-size:1.3rem;color:var(--mute);max-width:46ch;margin:0 0 2rem}
.claim{border-left:10px solid var(--ink);padding:.3rem 0 .3rem 1.2rem;font:700 clamp(1.4rem,2.4vw,2.2rem)/1.2 var(--sans);max-width:30ch;margin:0 0 2.2rem}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem 2rem;max-width:60rem;border-top:2px solid var(--ink);padding-top:1rem}
.legend-grid p{margin:.4rem 0 0;font-size:.95rem}
.start{margin-top:2rem;font:700 .9rem var(--mono);color:var(--mute)}

/* ---------- phase ---------- */
.phase{--c:var(--ink);border-top:10px solid var(--c);padding:1rem 0 1.6rem;margin-bottom:2.4rem}
.phase.prior{--c:var(--prior)}.phase.ours{--c:var(--ours)}
.phase.mixed{border-top:10px solid transparent;border-image:linear-gradient(90deg,var(--prior) 50%,var(--ours) 50%) 1}
.phase.collapsed{cursor:pointer}
.p-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.4rem 1.2rem;align-items:start}
.p-num{font:800 clamp(2rem,3.2vw,3rem)/1 var(--mono);color:var(--c)}
.phase.mixed .p-num{color:var(--ink)}
.p-title{margin:0;font:800 clamp(1.4rem,2.2vw,2.1rem)/1.1 var(--sans);letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.6rem}
.dep{font:700 .8rem var(--mono);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.tgl{background:var(--white);border:2px solid var(--ink);padding:.4rem .7rem;font:700 .78rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tgl:hover{background:var(--ink);color:var(--paper)}
.p-hl{grid-column:1 / -1}
.hl{display:inline-block;margin-top:1rem;padding:.5rem .9rem .6rem}
.hl-label{font:700 .8rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:.15rem}
.hl-nums{font:800 2rem/1 var(--mono);display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.hl.big .hl-nums{font-size:clamp(3rem,6.4vw,6rem);letter-spacing:-.03em}
.hb{color:var(--prior)}.ha{color:var(--ours)}
.hl-arrow{color:var(--ink);font-weight:400}
.hl.big{padding:.6rem 1.1rem .8rem}
.p-body{margin-top:1rem}
.sum{display:grid;gap:.6rem;margin:0;max-width:60rem}
.sum div{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:1rem;border-top:1px solid var(--line);padding-top:.6rem}
.sum dt{font:700 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:.2em}
.sum dd{margin:0;font-size:1.1rem}
.one{font-size:1.15rem;max-width:60rem;margin:0}
.hint{margin:.8rem 0 0;font:600 .78rem var(--mono);color:var(--mute);letter-spacing:.04em}
.beats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"b m" "p o" "w w";gap:1.4rem 2.2rem}
.beat{min-width:0;border-top:4px solid var(--ink);padding-top:.5rem}
.beat.before{border-top-color:var(--prior)}.beat.after{border-top-color:var(--ours)}
.beat.b{grid-area:b}.beat.p{grid-area:p}.beat.m{grid-area:m}.beat.o{grid-area:o}.beat.w{grid-area:w}
.beat h3{margin:0 0 .4rem;font:800 .85rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem}
.beat h3 .n{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;background:var(--ink);color:var(--paper);font-size:.8rem}
.beat.before h3 .n{background:var(--prior)}.beat.after h3 .n{background:var(--ours)}
.beat h3 .side{color:var(--mute);font-weight:600}
.beat p{margin:.2rem 0 .6rem;font-size:1.1rem}
.beat .move{font:800 1.35rem/1.25 var(--sans)}
.nums{font:700 1rem var(--mono);color:var(--prior)}
.caveats{margin:.4rem 0 0;padding-left:1.2rem;font-size:1rem}
.caveats li::marker{content:"▲ ";color:var(--ink)}
.warn{font:700 .8rem var(--mono);color:var(--tbd);border:2px solid var(--tbd);padding:.4rem .6rem;margin:.4rem 0}
.muted{color:var(--mute)}

/* ---------- chart ---------- */
figure.chart{margin:.6rem 0 0;padding:.5rem .6rem .6rem;background:var(--white);border:2px solid var(--ink)}
figure.chart.is-tbd{border:3px dashed var(--tbd);outline:0}
figure.chart figcaption{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font:700 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:.2rem}
figure.chart>svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:2}
.tick{font:600 15px var(--mono);fill:var(--ink)}
.axl{font:700 16px var(--sans);fill:var(--ink)}
.vlab{font:700 15px var(--mono);fill:var(--ink)}
.vlab.tbdv{fill:var(--tbd);font-style:italic}
.anno{font:700 16px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--white);stroke-width:5px;stroke-linejoin:round}
.anno-line{stroke:var(--ink);stroke-width:2}
.tbdbox{fill:var(--white);stroke:var(--tbd);stroke-width:2.5;stroke-dasharray:5 3}
.tbdtxt{font:800 15px var(--mono);fill:var(--tbd);letter-spacing:.1em}
.legend{list-style:none;margin:.3rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:.4rem}
.legend .role{font:700 .66rem var(--mono);letter-spacing:.08em;color:var(--mute);font-style:normal}

/* ---------- map ---------- */
.map h2{font:800 clamp(1.8rem,3vw,2.6rem)/1.1 var(--sans);margin:.2rem 0 .3rem}
.tablewrap{overflow-x:auto;border-top:4px solid var(--ink)}
table.cm{border-collapse:collapse;width:100%;min-width:48rem;font-size:1rem}
.cm th{font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:.7rem .7rem;border-bottom:2px solid var(--ink);color:var(--mute);white-space:nowrap}
.cm td{vertical-align:top;padding:.8rem .7rem;border-bottom:1px solid var(--line)}
.cm tr.row{cursor:pointer}
.cm tr.row:hover td{background:var(--white)}
.cm .ph-t{font-weight:800;display:block;margin-bottom:.35rem}
.cm .gain{display:inline-block;padding:.4rem .6rem;font:800 1.05rem var(--mono);white-space:nowrap}
.cm .gain small{display:block;font:600 .72rem var(--mono);color:var(--mute);letter-spacing:.04em;white-space:normal}
.cm .arrow{color:var(--mute)}
.cm td.fixc{border-left:4px solid var(--ours)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .beats{grid-template-columns:minmax(0,1fr);grid-template-areas:"b" "p" "m" "o" "w"}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:2px solid var(--ink);overflow-x:auto;overflow-y:visible;padding:.6rem}
  .rail ol{display:flex;gap:.4rem}
  .rail ol::before{display:none}
  .r-item{min-width:11rem}
  .keys{display:none}
  .p-head{grid-template-columns:auto minmax(0,1fr)}
  .p-head .tgl{grid-column:1 / -1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <h1 id="ptitle"></h1>
  <button id="btnOverview" type="button">Overview <span class="sr">(Escape)</span></button>
  <button id="btnAll" type="button" aria-pressed="false">Expand all <span class="sr">(A)</span></button>
</header>
<div class="app">
  <nav class="rail" aria-label="Phases" id="rail"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* =====================================================================
   PROJECT CONFIG  -  all content lives here. Edit this block only.
   - depth: "full" | "summary" | "stub"   (one field controls how much shows)
   - provenance: "prior" | "ours" | "mixed"
   - headline.placeholder / series.placeholder = true  -> shown as TBD
   - ChartSpec.errorBars: one entry per point; a number means +/- value,
     a [low, high] pair means absolute bounds.
   - Bar charts: points are [category, value]. Scatter: a series with
     role "reference" is drawn as a thin line (e.g. ideal y=x).
   - Pitfall chart and outcome chart are forced onto the SAME axes
     (the pitfall chart's yRange is used for both).
   - Phase numbers on screen are list positions (1, 2, 3 ...), not ids.
   ===================================================================== */
const PROJECT = {
  title: "Project title",
  subtitle: "One-line framing of the whole project",
  headlineClaim: "The single sentence we want people to remember",
  phases: [
    {
      id: "p1", title: "Reproduce the baseline", depth: "stub", provenance: "prior",
      oneLiner: "Re-ran the existing tool end to end to confirm its published numbers.",
      headline: { label: "Reproduced result", before: 0, after: 0, unit: "", placeholder: true }
    },
    {
      id: "p3", title: "Fix the evaluation method", depth: "summary", dependsOn: ["p1"], provenance: "ours",
      oneLiner: "Baseline error looked low only because it was measured on training data.",
      headline: { label: "Held-out error", before: 4, after: 19, unit: "%", placeholder: true },
      summary: {
        problem: "Reported error was measured on the data the model was trained on.",
        fix: "Evaluate on a held-out set with a clean split.",
        result: "Honest error is higher than reported, which is the real baseline to beat."
      }
    },
    {
      id: "p5", title: "Our estimator", depth: "full", dependsOn: ["p3"], provenance: "ours",
      oneLiner: "A first-principles model replaces the learned fit.",
      headline: { label: "Held-out error", before: 19, after: 7, unit: "%", placeholder: true },
      baseline:  { text: "Existing estimator, evaluated honestly in phase 2.", numbers: "19% held-out error" },
      pitfall:   { text: "Error spikes on large inputs because the model never saw that regime.",
                   evidenceChart: { type: "line", xLabel: "Input size", yLabel: "Error (%)", yRange: [0, 40],
                     series: [{ name: "Baseline", role: "baseline", points: [[1,5],[2,6],[4,12],[8,35]], placeholder: true }],
                     annotations: [{ x: 8, y: 35, text: "fails at large sizes" }] } },
      ourMove:   { text: "Replace the learned fit with a physics-based first-principles model." },
      outcome:   { text: "Error stays low across the full range.",
                   chart: { type: "line", xLabel: "Input size", yLabel: "Error (%)", yRange: [0, 40],
                     series: [
                       { name: "Baseline", role: "baseline", points: [[1,5],[2,6],[4,12],[8,35]], placeholder: true },
                       { name: "Ours", role: "ours", points: [[1,4],[2,5],[4,6],[8,7]], placeholder: true } ] } },
      whyBetter: { text: "The model extrapolates because it encodes the mechanism, not just past samples.",
                   caveats: ["Validated on one hardware target so far."] }
    },
    {
      id: "p6", title: "Chart demo: grouped bars", depth: "summary", dependsOn: ["p5"], provenance: "mixed",
      oneLiner: "Demo phase for the bar chart with error bars. Replace or delete.",
      headline: { label: "Mean error", before: 12, after: 5, unit: "%", placeholder: true },
      summary: { problem: "Placeholder: one operator is far worse than the others.",
                 fix: "Placeholder: calibrate that operator separately.",
                 result: "Placeholder: all operators within range." },
      baseline:  { text: "Placeholder baseline per operator.", numbers: "12% mean error" },
      pitfall:   { text: "Operator C is far worse than A and B.",
                   evidenceChart: { type: "bar", xLabel: "Operator", yLabel: "Error (%)", yRange: [0, 30],
                     series: [{ name: "Baseline", role: "baseline", points: [["A",8],["B",10],["C",24]], errorBars: [2,3,6], placeholder: true }],
                     annotations: [{ x: "C", y: 24, text: "outlier operator" }] } },
      ourMove:   { text: "Calibrate each operator separately." },
      outcome:   { text: "All three operators fall under the same limit.",
                   chart: { type: "bar", xLabel: "Operator", yLabel: "Error (%)", yRange: [0, 30],
                     series: [
                       { name: "Baseline", role: "baseline", points: [["A",8],["B",10],["C",24]], errorBars: [2,3,6], placeholder: true },
                       { name: "Ours", role: "ours", points: [["A",5],["B",5],["C",6]], errorBars: [1,1.5,2], placeholder: true } ] } },
      whyBetter: { text: "Placeholder: separate calibration removes the shared-fit bias.", caveats: ["Placeholder numbers only."] }
    },
    {
      id: "p7", title: "Chart demo: scatter", depth: "summary", dependsOn: ["p6"], provenance: "ours",
      oneLiner: "Demo phase for the scatter chart with a reference line. Replace or delete.",
      headline: { label: "Max miss", before: 40, after: 9, unit: " ms", placeholder: true },
      summary: { problem: "Placeholder: predictions drift from actuals at large values.",
                 fix: "Placeholder: refit with the large-value regime included.",
                 result: "Placeholder: points sit on the ideal line." },
      pitfall:   { text: "Predicted values drift below the ideal line for large actuals.",
                   evidenceChart: { type: "scatter", xLabel: "Actual (ms)", yLabel: "Predicted (ms)", yRange: [0, 100],
                     series: [
                       { name: "Ideal (y = x)", role: "reference", points: [[0,0],[100,100]] },
                       { name: "Baseline", role: "baseline", points: [[10,11],[25,24],[40,35],[60,48],[80,58],[95,62]], placeholder: true } ] } },
      ourMove:   { text: "Refit with the large-value regime included." },
      outcome:   { text: "Points follow the ideal line over the full range.",
                   chart: { type: "scatter", xLabel: "Actual (ms)", yLabel: "Predicted (ms)", yRange: [0, 100],
                     series: [
                       { name: "Ideal (y = x)", role: "reference", points: [[0,0],[100,100]] },
                       { name: "Baseline", role: "baseline", points: [[10,11],[25,24],[40,35],[60,48],[80,58],[95,62]], placeholder: true },
                       { name: "Ours", role: "ours", points: [[10,10],[25,26],[40,41],[60,59],[80,81],[95,93]], placeholder: true } ] } },
      whyBetter: { text: "Placeholder: the large-value regime is now in the training range." }
    }
  ],
  contributionMap: "auto"
};

/* =====================================================================
   GENERIC RENDERER  -  no project content below this line
   ===================================================================== */
const ROLE = {
  baseline:  { label: "BASELINE",  color: "var(--prior)", shape: "square" },
  ours:      { label: "OURS",      color: "var(--ours)",  shape: "circle" },
  reference: { label: "REFERENCE", color: "var(--mute)",  shape: "diamond" }
};
const PROV = {
  prior: { cls: "prior", label: "Prior work" },
  ours:  { cls: "ours",  label: "Our contribution" },
  mixed: { cls: "mixed", label: "Mixed" }
};
const PH = PROJECT.phases;
const N = PH.length;
const state = { cur: 0, reading: false, open: {} };   // cur: 0 = overview, 1..N = phases, N+1 = map
const $ = (s) => document.querySelector(s);
const main = $("#main"), rail = $("#rail");
let chartSeq = 0;

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtNum = (v) => Number.isInteger(v) ? String(v) : String(+Number(v).toFixed(2));
const pad2 = (n) => String(n).padStart(2, "0");
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const provOf = (p) => PROV[p.provenance] || PROV.mixed;
const isOpen = (p) => (p.id in state.open) ? state.open[p.id] : (state.reading ? true : p.depth === "full");
const secId = (i) => i === 0 ? "sec-overview" : i === N + 1 ? "sec-map" : "ph-" + PH[i - 1].id;

/* ---------- charts ---------- */
function niceTicks(r, n = 5) {
  const a = r[0], b = r[1], span = (b - a) || 1, raw = span / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let t = Math.ceil(a / step - 1e-9) * step; t <= b + 1e-9; t += step) out.push(+t.toFixed(10));
  return out;
}
function chartDomain(specs) {
  const xs = [];
  specs.forEach((s) => s.series.forEach((se) => se.points.forEach((pt) => xs.push(pt[0]))));
  const anyBar = specs.some((s) => s.type === "bar");
  if (!anyBar && xs.every((x) => typeof x === "number" && isFinite(x))) {
    const uniq = [...new Set(xs)].sort((a, b) => a - b);
    return { kind: "num", min: uniq[0], max: uniq[uniq.length - 1], ticks: uniq };
  }
  const cats = [];
  xs.forEach((x) => { const k = String(x); if (cats.indexOf(k) < 0) cats.push(k); });
  return { kind: "cat", cats };
}
function yRangeFor(specs) {

  else if (k === "e") {
    e.preventDefault();
    const art = t && t.closest && t.closest("article.phase");
    const id = art ? art.id.slice(3) : (state.cur >= 1 && state.cur <= N ? PH[state.cur - 1].id : null);
    if (id) toggleId(id);
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h) gotoId(h); });

/* ---------- boot ---------- */
document.title = PROJECT.title;
$("#ptitle").textContent = PROJECT.title;
(function init() {
  const h = location.hash.slice(1);
  if (h === "map") state.cur = N + 1;
  else { const j = PH.findIndex((p) => p.id === h); if (j >= 0) state.cur = j + 1; }
  renderAll();
})();
</script>
